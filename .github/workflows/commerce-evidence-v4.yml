name: SENLIS Evidence Pilot v4 - 10 products only
on:
  workflow_dispatch:
  push:
    branches: [feature/commerce-evidence-v4-20261005]
    paths: [tools/commerce_evidence_v4_trigger.txt]
permissions:
  contents: read
concurrency:
  group: senlis-commerce-evidence-pilot
  cancel-in-progress: false
jobs:
  evidence-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r tools/commerce_v3_requirements.txt
      - name: Identity and evidence regression tests
        run: |
          python -m unittest discover -s tests/commerce_v4 -v
          python -m unittest discover -s tests/commerce_v3 -v
      - name: Search 10 targets using live source catalogues
        run: python tools/commerce_evidence_v4.py --seconds 1200 --output commerce_v4_evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SENLIS-commerce-v4-evidence-${{ github.run_attempt }}
          path: commerce_v4_evidence
          retention-days: 30
          if-no-files-found: error
