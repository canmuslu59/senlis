name: SENLIS 501 Reconciliation Status
on:
  push:
    branches: [overnight/full-enrichment-20261001]
    paths:
      - "tools/turkey_501_reconciliation_status.py"
      - "data/turkey_missing_brand_staging/**"
      - ".github/workflows/turkey-501-reconciliation.yml"
  workflow_dispatch:
jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/turkey_501_reconciliation_status.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SENLIS-turkey-501-reconciliation
          path: turkey_501_reconciliation/
          retention-days: 5
