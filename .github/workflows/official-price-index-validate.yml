name: SENLIS Official Price Index Validate
on:
  push:
    branches: [overnight/full-enrichment-20261001]
    paths:
      - "data/official_price_index.csv"
      - "tools/validate_official_price_index.py"
      - ".github/workflows/official-price-index-validate.yml"
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4 lxml rapidfuzz
      - run: python tools/validate_official_price_index.py
