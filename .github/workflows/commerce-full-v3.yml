name: SENLIS Full Commerce v3 PAUSED
on:
  workflow_dispatch:
  push:
    branches: [feature/commerce-full-v3-20261004]
    paths:
      - tools/commerce_full_v3_trigger.txt
permissions:
  contents: read
concurrency:
  group: senlis-commerce-v3-full
  cancel-in-progress: true
jobs:
  paused:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Full queue stopped by user request
        run: |
          echo "Full catalogue discovery is paused. No catalogue workers are scheduled."
          echo "Existing data branch checkpoints are preserved. Only a separately scoped evidence pilot may run next."
