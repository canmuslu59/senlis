name: SENLIS Full Commerce v3
on:
  workflow_dispatch:
  push:
    branches: [feature/commerce-full-v3-20261004]
    paths:
      - tools/commerce_full_v3_trigger.txt
permissions:
  contents: write
  actions: read
concurrency:
  group: senlis-commerce-v3-full
  cancel-in-progress: false
jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/commerce_v3_requirements.txt
      - run: pip install -r tools/commerce_v3_requirements.txt
      - name: Regression tests
        run: |
          python -m unittest discover -s tests/commerce_v3 -v
          python tools/matching_regression_test.py
      - name: Verify durable checkpoint access
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PYTHONPATH=tools python - <<'PYCODE'
          import gzip
          from commerce_full_v3 import Publisher
          p=Publisher()
          assert p.chunk(0, 'healthcheck.jsonl.gz', gzip.compress(b'',mtime=0))
          p.load(0)
          print('Durable checkpoint write/read verified')
          PYCODE
      - name: Live search and 10-product canary
        run: python tools/commerce_full_v3.py canary --seconds 1200 --output commerce_v3_canary
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v3-canary-${{ github.run_attempt }}
          path: commerce_v3_canary
          retention-days: 30
          if-no-files-found: warn
  wave_00:
    needs: [canary]
    if: ${{ always() && !cancelled() && needs.canary.result == 'success' }}
    uses: ./.github/workflows/commerce-full-v3-batch.yml
    with:
      wave: 0
  wave_01:
    needs: [canary, wave_00]
    if: ${{ always() && !cancelled() && needs.canary.result == 'success' }}
    uses: ./.github/workflows/commerce-full-v3-batch.yml
    with:
