name: SENLIS Official Catalog Index Stats
on:
  push:
    branches: [overnight/full-enrichment-20261001]
    paths:
      - "tools/official_catalog_index_stats.py"
      - ".github/workflows/official-catalog-index-stats.yml"
      - "tools/overnight_full_enrichment.py"
  workflow_dispatch:
jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4 lxml rapidfuzz
      - run: python tools/official_catalog_index_stats.py
