name: SENLIS Commerce Scope Stats

on:
  push:
    branches:
      - overnight/full-enrichment-20261001
    paths:
      - "tools/commerce_scope_stats.py"
      - ".github/workflows/commerce-scope-stats.yml"
      - "data/master_manifest_174259/**"
      - "data/turkiye_retail_brands_501.txt"
      - "tools/overnight_full_enrichment.py"
  workflow_dispatch:

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4 lxml rapidfuzz
      - run: python tools/commerce_scope_stats.py
