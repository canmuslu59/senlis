name: SENLIS Dynamic Catalog Probe
on:
  push:
    branches: [overnight/full-enrichment-20261001]
    paths:
      - "tools/dynamic_catalog_probe.py"
      - ".github/workflows/dynamic-catalog-probe.yml"
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: python tools/dynamic_catalog_probe.py
