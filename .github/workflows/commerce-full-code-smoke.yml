name: SENLIS Full Commerce Code Smoke
on:
  push:
    branches: [overnight/full-enrichment-20261001]
    paths:
      - ".github/workflows/commerce-full-code-smoke.yml"
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMMERCE_SHARD_INDEX: "0"
      COMMERCE_SHARD_COUNT: "200000"
      COMMERCE_WORKERS: "1"
      COMMERCE_SCOPE: "tr_retail"
      SEARCH_ENGINE_FALLBACK: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4 lxml rapidfuzz
      - name: Run one-product full runner smoke
        run: python tools/commerce_full_tr.py
      - name: Verify and merge
        shell: bash
        run: |
          python - <<'PY'
          import csv,glob
          files=glob.glob("commerce_full_out/commerce_shard_*.csv")
          assert files, "no shard csv"
          with open(files[0],encoding="utf-8-sig",newline="") as f:
              rows=list(csv.DictReader(f))
          assert len(rows)==1, f"expected 1 row, got {len(rows)}"
          print("SHARD_SMOKE_OK",rows[0]["product_id"],rows[0]["commerce_status"])
          PY
          mkdir -p commerce_inputs/smoke
          cp commerce_full_out/commerce_shard_*.csv commerce_inputs/smoke/
          python tools/merge_commerce_full.py
          test -f commerce_final/SENLIS_commerce_tr_full.csv
          test -f commerce_final/SENLIS_commerce_tr_full.sqlite
          echo MERGE_SMOKE_OK
