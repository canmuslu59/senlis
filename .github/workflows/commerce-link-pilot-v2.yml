name: SENLIS Commerce Link Pilot v2

on:
  workflow_dispatch:
  push:
    branches:
      - feature/commerce-links-v2-20261002
    paths:
      - ".github/workflows/commerce-link-pilot-v2.yml"
      - "tools/commerce_link_v2.py"
      - "tools/commerce_link_v2_trigger.txt"

concurrency:
  group: senlis-commerce-link-pilot-v2
  cancel-in-progress: true

jobs:
  preflight:
    name: Validate commerce-v2 inputs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4 lxml rapidfuzz
      - name: Verify scripts and 174259 manifest
        run: |
          python -m py_compile tools/commerce_link_v2.py
          python - <<'PY'
          import csv,glob,gzip
          rows=0;ids=set()
          for p in sorted(glob.glob('data/master_manifest_174259/part_*.csv*')):
              opener=gzip.open if p.endswith('.gz') else open
              with opener(p,'rt',encoding='utf-8-sig',newline='') as f:
                  for r in csv.DictReader(f):
                      rows+=1;ids.add(int(r['id']))
          print({'rows':rows,'unique':len(ids)})
          assert rows==174259 and len(ids)==174259
          PY

  pilot:
    needs: preflight
    name: "Pilot v2 / shard ${{ matrix.shard }}"
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0,1,2,3]
    env:
      PILOT_SHARD_INDEX: "${{ matrix.shard }}"
      PILOT_SHARD_COUNT: "4"
      PILOT_SIZE: "1000"
      PILOT_WORKERS: "4"
      PILOT_MAX_RESULTS: "18"
      SEARCH_ENGINE_FALLBACK: "1"
      SERPER_API_KEY: "${{ secrets.SERPER_API_KEY }}"
      HOST_MIN_INTERVAL: "0.6"
      HOST_COOLDOWN: "20"
      HOST_BLOCK_LIMIT: "8"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4 lxml rapidfuzz
      - name: Discover Turkish purchase links
        run: python tools/commerce_link_v2.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: commerce-link-pilot-v2-shard-${{ matrix.shard }}
          path: commerce_link_v2_out/
          if-no-files-found: warn
          retention-days: 7

  finalize:
    needs: pilot
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMMERCE_V2_MODE: "merge"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: commerce-link-pilot-v2-shard-*
          path: commerce_link_v2_inputs/
      - run: python tools/commerce_link_v2.py
      - uses: actions/upload-artifact@v4
        with:
          name: SENLIS-commerce-link-pilot-v2
          path: commerce_link_v2_final/
          if-no-files-found: error
          retention-days: 14
