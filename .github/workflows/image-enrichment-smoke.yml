name: SENLIS Image Enrichment Smoke

on:
  push:
    branches:
      - overnight/full-enrichment-20261001
    paths:
      - "tools/image_enrichment.py"
      - ".github/workflows/image-enrichment-smoke.yml"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      START_ID: "1"
      END_ID: "200"
      FAST_WORKERS: "6"
      FRAG_WORKERS: "3"
      FRAG_DELAY: "0.25"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4 lxml
      - run: python tools/image_enrichment.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SENLIS-image-smoke
          path: image_out/
          retention-days: 3
