name: SENLIS Commerce Pilot 100

on:
  push:
    branches:
      - overnight/full-enrichment-20261001
    paths:
      - ".github/workflows/commerce-pilot-100.yml"
      - "tools/overnight_full_enrichment.py"
      - "tools/commerce_pilot_100.py"
  workflow_dispatch:

concurrency:
  group: senlis-commerce-pilot-100
  cancel-in-progress: true

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml rapidfuzz
      - name: Run 100 product commerce pilot
        run: python tools/commerce_pilot_100.py
      - name: Upload pilot results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SENLIS-commerce-pilot-100
          path: commerce_pilot_100/
          if-no-files-found: warn
          retention-days: 3
