name: SENLIS hosted verification

on:
  push:
    branches: [feature/senlis-premium-foundation]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check hosted Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms/android-35" || sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Test match model
        run: |
          mkdir -p model-test
          javac -d model-test app/src/main/java/com/innative/senlis/MatchEngine.java app/src/test/java/com/innative/senlis/MatchEngineTest.java
          java -cp model-test com.innative.senlis.MatchEngineTest
      - name: Build APK
        run: |
          gradle :app:assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk SENLIS-v0.5.0-preview.apk
          sha256sum SENLIS-v0.5.0-preview.apk > SENLIS-v0.5.0-preview.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: SENLIS-v0.5.0-preview-hosted
          path: |
            SENLIS-v0.5.0-preview.apk
            SENLIS-v0.5.0-preview.sha256
          retention-days: 7
