name: SENLIS hosted verification

on:
  push:
    branches: [feature/senlis-premium-foundation]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  firestore-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save firebase-tools @firebase/rules-unit-testing firebase
      - run: npx firebase emulators:exec --project demo-senlis --only firestore "node ci/firestore_rules.test.cjs"

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check hosted Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms/android-35" || sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Test match model
        run: |
          mkdir -p model-test
          javac -d model-test app/src/main/java/com/innative/senlis/MatchEngine.java app/src/test/java/com/innative/senlis/MatchEngineTest.java
          java -cp model-test com.innative.senlis.MatchEngineTest
      - name: Test service and database rules
        run: python3 -m unittest discover -s service/tests -v
      - name: Build APK
        run: |
          gradle :app:assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk SENLIS-v0.6.0-dev.apk
          sha256sum SENLIS-v0.6.0-dev.apk > SENLIS-v0.6.0-dev.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: SENLIS-v0.6.0-dev-hosted
          path: |
            SENLIS-v0.6.0-dev.apk
            SENLIS-v0.6.0-dev.sha256
          retention-days: 7

  emulator-smoke:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api-level: [23, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: SENLIS-v0.6.0-dev-hosted
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: python3 ci/android_smoke.py SENLIS-v0.6.0-dev.apk screenshots/api-${{ matrix.api-level }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: senlis-screenshots-api-${{ matrix.api-level }}
          path: screenshots/api-${{ matrix.api-level }}/
          retention-days: 7

  postgres-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: senlis
          POSTGRES_PASSWORD: senlis-ci-only
          POSTGRES_DB: senlis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U senlis" --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://senlis:senlis-ci-only@localhost:5432/senlis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'psycopg[binary]==3.2.12'
      - run: python -m ci.postgres_smoke
