name: SENLIS Local Brand Master Audit
on:
  push:
    branches: [overnight/full-enrichment-20261001]
    paths:
      - "tools/local_brand_master_audit.py"
      - ".github/workflows/local-brand-master-audit.yml"
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/local_brand_master_audit.py
