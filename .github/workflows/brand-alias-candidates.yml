name: SENLIS Brand Alias Candidates
on:
  push:
    branches: [overnight/full-enrichment-20261001]
    paths:
      - "tools/brand_alias_candidates.py"
      - ".github/workflows/brand-alias-candidates.yml"
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install rapidfuzz
      - run: python tools/brand_alias_candidates.py
