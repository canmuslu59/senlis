name: SENLIS Parfumo Fallback Probe

on:
  push:
    branches:
      - overnight/full-enrichment-20261001
    paths:
      - "tools/parfumo_fallback_probe.py"
      - ".github/workflows/parfumo-fallback-probe.yml"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4 lxml rapidfuzz
      - run: python tools/parfumo_fallback_probe.py
