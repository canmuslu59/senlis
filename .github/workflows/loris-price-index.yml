name: SENLIS Loris Price Index
on:
  push:
    branches: [overnight/full-enrichment-20261001]
    paths:
      - "tools/build_loris_price_index.py"
      - ".github/workflows/loris-price-index.yml"
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4 lxml rapidfuzz
      - run: python tools/build_loris_price_index.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SENLIS-loris-price-index
          path: loris_price_index/
          retention-days: 5
