name: SENLIS Matching Regression
on:
  push:
    branches: [overnight/full-enrichment-20261001]
    paths:
      - "tools/matching_regression_test.py"
      - "tools/overnight_full_enrichment.py"
      - "tools/image_sources.py"
      - ".github/workflows/matching-regression.yml"
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4 lxml rapidfuzz
      - run: python tools/matching_regression_test.py
