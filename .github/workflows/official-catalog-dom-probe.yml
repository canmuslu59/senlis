name: SENLIS Official Catalog DOM Probe
on:
  push:
    branches: [overnight/full-enrichment-20261001]
    paths:
      - "tools/official_catalog_dom_probe.py"
      - ".github/workflows/official-catalog-dom-probe.yml"
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4 lxml
      - run: python tools/official_catalog_dom_probe.py
