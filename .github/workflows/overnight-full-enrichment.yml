name: SENLIS Overnight Full Enrichment

on:
  push:
    branches:
      - overnight/full-enrichment-20261001
    paths:
      - ".github/workflows/overnight-full-enrichment.yml"
  workflow_dispatch:

concurrency:
  group: senlis-overnight-full-enrichment
  cancel-in-progress: false

jobs:
  pass1:
    name: "Pass 1 / shard ${{ matrix.shard }}"
    runs-on: ubuntu-latest
    timeout-minutes: 260
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install enrichment dependencies
        run: pip install requests beautifulsoup4 lxml rapidfuzz
      - name: Enrich assigned catalog shard
        continue-on-error: true
        env:
          SHARD_INDEX: "${{ matrix.shard }}"
          SHARD_COUNT: "8"
          WORKERS: "2"
          MAX_SECONDS: "14400"
        run: python tools/overnight_full_enrichment.py
      - name: Upload pass 1 checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: overnight-pass1-shard-${{ matrix.shard }}
          path: out/
          if-no-files-found: warn
          retention-days: 7

  pass2:
    name: "Pass 2 / shard ${{ matrix.shard }}"
    needs: pass1
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 170
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install enrichment dependencies
        run: pip install requests beautifulsoup4 lxml rapidfuzz
      - name: Download matching pass 1 checkpoint
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: overnight-pass1-shard-${{ matrix.shard }}
          path: previous/
      - name: Continue remaining products in shard
        continue-on-error: true
        env:
          SHARD_INDEX: "${{ matrix.shard }}"
          SHARD_COUNT: "8"
          WORKERS: "2"
          MAX_SECONDS: "9000"
        run: python tools/overnight_full_enrichment_pass2.py
      - name: Upload final shard checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: overnight-pass2-shard-${{ matrix.shard }}
          path: out/
          if-no-files-found: warn
          retention-days: 7

  finalize:
    name: Merge overnight results
    needs: pass2
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Download all final shard checkpoints
        uses: actions/download-artifact@v4
        with:
          pattern: overnight-pass2-shard-*
          path: final_inputs/
          merge-multiple: false
      - name: Merge CSVs and build SQLite result
        run: python tools/merge_overnight_results.py
      - name: Upload consolidated overnight database
        uses: actions/upload-artifact@v4
        with:
          name: SENLIS-overnight-final
          path: final/
          if-no-files-found: error
          retention-days: 14
