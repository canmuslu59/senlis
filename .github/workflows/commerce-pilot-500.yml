name: SENLIS Commerce Pilot 500
on:
  push:
    branches: [overnight/full-enrichment-20261001]
    paths:
      - "tools/commerce_pilot_500.py"
      - ".github/workflows/commerce-pilot-500.yml"
  workflow_dispatch:

concurrency:
  group: senlis-commerce-pilot-500
  cancel-in-progress: true

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      COMMERCE_SCOPE: tr_retail
      SEARCH_ENGINE_FALLBACK: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4 lxml rapidfuzz
      - run: python tools/commerce_pilot_500.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SENLIS-commerce-pilot-500
          path: commerce_pilot_500/
          if-no-files-found: warn
          retention-days: 5
