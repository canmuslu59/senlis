name: Build SENLIS APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Prepare local Android SDK
        shell: powershell
        run: |
          Write-Host "JAVA_HOME=$env:JAVA_HOME"
          Write-Host "ANDROID_HOME=$env:ANDROID_HOME"
          java -version
          gradle --version

          $candidates = @(@(
            $env:ANDROID_HOME,
            $env:ANDROID_SDK_ROOT,
            "C:\actions-runner\android-sdk",
            "$env:LOCALAPPDATA\Android\Sdk",
            "C:\Android\Sdk"
          ) | Where-Object { $_ -and (Test-Path $_) } | Select-Object -Unique)

          if ($candidates.Count -eq 0) {
            throw "No Android SDK installation could be found."
          }

          $sdk = [string]$candidates[0]
          $env:ANDROID_HOME = $sdk
          $env:ANDROID_SDK_ROOT = $sdk
          "ANDROID_HOME=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ANDROID_SDK_ROOT=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Using Android SDK: $sdk"

          if (-not (Test-Path "$sdk\platforms\android-35")) {
            $sdkmanager = @(
              "$sdk\cmdline-tools\latest\bin\sdkmanager.bat",
              "$sdk\cmdline-tools\16.0\bin\sdkmanager.bat",
              "$sdk\tools\bin\sdkmanager.bat"
            ) | Where-Object { Test-Path $_ } | Select-Object -First 1

            if (-not $sdkmanager) {
              throw "android-35 is missing and sdkmanager could not be found."
            }

            Write-Host "Installing Android platform 35 and build tools..."
            & $sdkmanager "platforms;android-35" "build-tools;35.0.0"
            if ($LASTEXITCODE -ne 0) { throw "sdkmanager failed with exit code $LASTEXITCODE" }
          }

          if (-not (Test-Path "$sdk\platforms\android-35")) {
            throw "Android SDK platform 35 is still missing after setup."
          }

          Write-Host "Android SDK 35 ready."

      - name: Decode premium UI assets
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "app\src\main\res\drawable" | Out-Null
          Get-ChildItem "ui-assets\*.b64" | ForEach-Object {
            $name = [System.IO.Path]::GetFileNameWithoutExtension($_.Name)
            $raw = (Get-Content $_.FullName -Raw).Trim()
            [System.IO.File]::WriteAllBytes(
              "app\src\main\res\drawable\$name.jpg",
              [System.Convert]::FromBase64String($raw)
            )
          }
          Get-ChildItem "app\src\main\res\drawable"

      - name: Build debug APK
        shell: powershell
        run: |
          gradle :app:assembleDebug --stacktrace

      - name: Prepare APK
        shell: powershell
        run: |
          Copy-Item "app\build\outputs\apk\debug\app-debug.apk" "SENLIS-v0.2.0-beta.apk" -Force
          (Get-FileHash "SENLIS-v0.2.0-beta.apk" -Algorithm SHA256).Hash | Out-File "SENLIS-v0.2.0-beta.sha256"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SENLIS-v0.2.0-beta
          path: |
            SENLIS-v0.2.0-beta.apk
            SENLIS-v0.2.0-beta.sha256
          retention-days: 7
