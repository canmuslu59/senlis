name: Build SENLIS APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Check local Android environment
        shell: powershell
        run: |
          Write-Host "JAVA_HOME=$env:JAVA_HOME"
          Write-Host "ANDROID_HOME=$env:ANDROID_HOME"
          java -version
          gradle --version
          if (-not $env:ANDROID_HOME) {
            throw "ANDROID_HOME is not set on the self-hosted runner."
          }
          if (-not (Test-Path "$env:ANDROID_HOME\platforms\android-35")) {
            throw "Android SDK platform 35 is missing on the self-hosted runner."
          }

      - name: Decode premium UI assets
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "app\src\main\res\drawable" | Out-Null
          Get-ChildItem "ui-assets\*.b64" | ForEach-Object {
            $name = [System.IO.Path]::GetFileNameWithoutExtension($_.Name)
            $raw = (Get-Content $_.FullName -Raw).Trim()
            [System.IO.File]::WriteAllBytes(
              "app\src\main\res\drawable\$name.jpg",
              [System.Convert]::FromBase64String($raw)
            )
          }
          Get-ChildItem "app\src\main\res\drawable"

      - name: Build debug APK
        shell: powershell
        run: |
          gradle :app:assembleDebug --stacktrace

      - name: Prepare APK
        shell: powershell
        run: |
          Copy-Item "app\build\outputs\apk\debug\app-debug.apk" "SENLIS-v0.2.0-beta.apk" -Force
          (Get-FileHash "SENLIS-v0.2.0-beta.apk" -Algorithm SHA256).Hash | Out-File "SENLIS-v0.2.0-beta.sha256"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SENLIS-v0.2.0-beta
          path: |
            SENLIS-v0.2.0-beta.apk
            SENLIS-v0.2.0-beta.sha256
          retention-days: 7
