name: SENLIS Windows manual crosscheck

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Find Android SDK
        shell: powershell
        run: |
          $candidates = @($env:ANDROID_HOME, $env:ANDROID_SDK_ROOT, 'C:\actions-runner\android-sdk', "$env:LOCALAPPDATA\Android\Sdk")
          $sdk = $candidates | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          if (-not $sdk) { throw 'Android SDK not found on self-hosted runner' }
          "ANDROID_HOME=$sdk" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "ANDROID_SDK_ROOT=$sdk" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          if (-not (Test-Path "$sdk\platforms\android-35")) {
            $manager = @("$sdk\cmdline-tools\latest\bin\sdkmanager.bat", "$sdk\cmdline-tools\16.0\bin\sdkmanager.bat") | Where-Object { Test-Path $_ } | Select-Object -First 1
            if (-not $manager) { throw 'Android 35 and sdkmanager missing' }
            & $manager 'platforms;android-35' 'build-tools;35.0.0'
            if ($LASTEXITCODE -ne 0) { throw "sdkmanager failed: $LASTEXITCODE" }
          }
      - name: Test match engine
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path model-test | Out-Null
          javac -d model-test app/src/main/java/com/innative/senlis/MatchEngine.java app/src/test/java/com/innative/senlis/MatchEngineTest.java
          if ($LASTEXITCODE -ne 0) { throw 'Model compilation failed' }
          java -cp model-test com.innative.senlis.MatchEngineTest
          if ($LASTEXITCODE -ne 0) { throw 'Model tests failed' }
      - name: Build development APK
        shell: powershell
        run: |
          gradle :app:assembleDebug --stacktrace
          if ($LASTEXITCODE -ne 0) { throw 'Android build failed' }
          Copy-Item app/build/outputs/apk/debug/app-debug.apk SENLIS-v0.6.0-dev-windows.apk
          (Get-FileHash SENLIS-v0.6.0-dev-windows.apk -Algorithm SHA256).Hash | Out-File SENLIS-v0.6.0-dev-windows.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: SENLIS-v0.6.0-dev-windows
          path: |
            SENLIS-v0.6.0-dev-windows.apk
            SENLIS-v0.6.0-dev-windows.sha256
          retention-days: 7
