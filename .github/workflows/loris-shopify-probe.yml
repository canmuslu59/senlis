name: SENLIS Loris Shopify Probe
on:
  push:
    branches: [overnight/full-enrichment-20261001]
    paths:
      - "tools/loris_shopify_probe.py"
      - ".github/workflows/loris-shopify-probe.yml"
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python tools/loris_shopify_probe.py
