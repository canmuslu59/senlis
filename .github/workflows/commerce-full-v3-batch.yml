name: SENLIS Commerce v3 four-lane batch
on:
  workflow_call:
    inputs:
      wave:
        required: true
        type: number
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        lane: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/commerce_v3_requirements.txt
      - run: pip install -r tools/commerce_v3_requirements.txt
      - name: Search assigned catalogue IDs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SCAN_WAVE: ${{ inputs.wave }}
          SCAN_LANE: ${{ matrix.lane }}
        run: |
          SCAN_SHARD=$((SCAN_WAVE * 4 + SCAN_LANE))
          python tools/commerce_full_v3.py worker --shard "$SCAN_SHARD" --seconds 18000 --output commerce_v3_out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v3-shard-${{ inputs.wave }}-${{ matrix.lane }}-${{ github.run_attempt }}
          path: commerce_v3_out
          retention-days: 30
          if-no-files-found: warn
