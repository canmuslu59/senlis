name: SENLIS 1000 Product Enrichment Pilot

on:
  push:
    branches:
      - pilot/enrichment-1000-20261001
    paths:
      - ".github/workflows/enrichment-pilot.yml"
  workflow_dispatch:

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml rapidfuzz
      - name: Run 1000-product enrichment
        env:
          WORKERS: "6"
        run: python tools/enrich_pilot.py
      - name: Upload pilot results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: senlis-pilot-1000-results
          path: artifacts/
          if-no-files-found: warn
