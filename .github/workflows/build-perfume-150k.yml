name: Export perfume 150k dataset

on:
  push:
    branches:
      - data/perfume-150k-20260928
    paths:
      - .github/workflows/build-perfume-150k.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: data/perfume-150k-20260928

      - name: Verify dataset
        run: |
          test -f data/parfum_bodymist_150k.txt
          wc -l data/parfum_bodymist_150k.txt
          ls -lh data/parfum_bodymist_150k.txt

      - name: Upload TXT artifact
        uses: actions/upload-artifact@v4
        with:
          name: parfum-bodymist-150k-txt
          path: data/parfum_bodymist_150k.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
