name: SENLIS Official Price Index
on:
  push:
    branches: [overnight/full-enrichment-20261001]
    paths:
      - "tools/build_official_price_index.py"
      - "tools/overnight_full_enrichment.py"
      - ".github/workflows/official-price-index.yml"
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMMERCE_SCOPE: all
      SEARCH_ENGINE_FALLBACK: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4 lxml rapidfuzz
      - run: python tools/build_official_price_index.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SENLIS-official-price-index
          path: official_price_index/
          retention-days: 5
