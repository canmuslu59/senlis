# Review resource costs and secrets before syncing this Blueprint.
databases:
  - name: senlis-db
    databaseName: senlis
    user: senlis_app
    region: frankfurt
    plan: 0.5c-1g
    ipAllowList: []
services:
  - type: web
    name: senlis-api
    runtime: python
    region: frankfurt
    plan: 0.5c-512mb
    buildCommand: pip install -r service/requirements.txt
    startCommand: python -m service.curated && gunicorn service.api:application --bind 0.0.0.0:$PORT --workers 2 --threads 4
    healthCheckPath: /v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: senlis-db
          property: connectionString
      - key: EDITOR_TOKEN
        sync: false
  - type: cron
    name: senlis-source-sync
    runtime: python
    region: frankfurt
    plan: 0.5c-512mb
    schedule: '20 2 * * *'
    buildCommand: pip install -r service/requirements.txt
    startCommand: python -m service.curated && python -m service.jobs sync
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: senlis-db
          property: connectionString
      - key: SOURCE_CONTACT
        sync: false
      - key: OBF_PAGES
        value: '1'
  - type: cron
    name: senlis-daily-push
    runtime: python
    region: frankfurt
    plan: 0.5c-512mb
    schedule: '0 * * * *'
    buildCommand: pip install -r service/requirements.txt
    startCommand: python -m service.jobs deliver
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: senlis-db
          property: connectionString
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
