plugins {
    id 'com.android.application'
}

android {
    namespace 'com.innative.senlis'
    compileSdk 35

    defaultConfig {
        applicationId "com.innative.senlis"
        minSdk 23
        targetSdk 35
        versionCode 4
        versionName "0.4.0"
    }

    buildTypes {
        debug { minifyEnabled false }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
