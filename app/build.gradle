plugins { id 'com.android.application' }

android {
    namespace 'com.innative.senlis'
    compileSdk 35

    defaultConfig {
        applicationId "com.innative.senlis"
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName "0.2.0-beta"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
