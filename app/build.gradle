plugins { id 'com.android.application' }

android {
    namespace 'com.innative.senlis'
    compileSdk 35

    defaultConfig {
        applicationId 'com.innative.senlis.preview'
        minSdk 23
        targetSdk 35
        versionCode 6
        versionName '0.6.0-dev'
        buildConfigField 'String', 'SENLIS_CATALOG_URL', '"' + (project.findProperty('senlisCatalogUrl') ?: 'https://raw.githubusercontent.com/canmuslu59/senlis/main/docs/catalogue.json') + '"'
        buildConfigField 'String', 'FIREBASE_APP_ID', '"' + (project.findProperty('firebaseAppId') ?: '') + '"'
        buildConfigField 'String', 'FIREBASE_API_KEY', '"' + (project.findProperty('firebaseApiKey') ?: '') + '"'
        buildConfigField 'String', 'FIREBASE_PROJECT_ID', '"' + (project.findProperty('firebaseProjectId') ?: '') + '"'
        buildConfigField 'String', 'FIREBASE_SENDER_ID', '"' + (project.findProperty('firebaseSenderId') ?: '') + '"'
    }

    buildTypes {
        release { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures { buildConfig true }
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:34.19.0')
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
}
